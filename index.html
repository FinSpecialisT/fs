<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinSpecialisT Store</title>
<style>
  body { margin:0; font-family:Arial; background:#111; color:white; }
  .hidden { display:none; }
  header { display:flex; justify-content:space-between; padding:15px; background:#000; }
  .cart-icon { cursor:pointer; }
  .page { padding:15px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .item { background:#1a1a1a; padding:10px; border:1px solid #1e3a8a; border-radius:10px; }
  .item img { width:100%; border-radius:10px; }
  button { width:100%; padding:8px; margin-top:8px; border:none; border-radius:8px; background:#1e40af; color:white; cursor:pointer; }
  button.back { background:#333; }
  .social { text-align:center; margin-top:20px; font-size:14px; }
  .social a { color:#3b82f6; margin:0 5px; text-decoration:none; }
</style>
</head>
<body>

<header>
  <div>FinSpecialisT</div>
  <div class="cart-icon" onclick="showCart()">🛒</div>
</header>

<!-- HOME -->
<div id="home" class="page">
  <div style="text-align:center;">
    <img src="logo.jpg" style="width:120px; height:120px; border-radius:50%;" />
    <p>FinSpecialisT • Ikan Hias Berkualitas</p>
  </div>

  <div class="grid">
    <button onclick="showPage('molly')">Molly Specialist</button>
    <button onclick="showPage('guppy')">Guppy SpecialisT</button>
    <button onclick="showPage('cupang')">SpecialisT Cupang</button>
    <button onclick="showPage('ikanlain')">Ikan Lain</button>
    <button onclick="showPage('perlengkapan')">Perlengkapan</button>
    <button onclick="showPage('stiker')">Sticker SpecialisT</button>
    <button onclick="showPage('bantuan')">Bantuan / Informasi</button>
  </div>

  <div class="social">
    <a href="https://wa.me/6285646746618">WhatsApp</a>
    <a href="https://www.instagram.com/fin_specialist?igsh=d3EybXhlaTFoY3Aw">Instagram</a>
    <a href="https://www.tiktok.com/@finspecialist?_r=1&_t=ZS-91Q668Wuklw">TikTok</a>
    <a href="https://www.facebook.com/share/17ajq3N4DV/">Facebook</a>
  </div>
</div>

<!-- TEMPLATE PAGES -->
<div id="molly" class="page hidden"></div>
<div id="guppy" class="page hidden"></div>
<div id="cupang" class="page hidden"></div>
<div id="ikanlain" class="page hidden"></div>
<div id="perlengkapan" class="page hidden"></div>
<div id="stiker" class="page hidden"></div>
<div id="bantuan" class="page hidden">
  <button class="back" onclick="showPage('home')">← Kembali</button>
  <p>Silakan hubungi kami jika membutuhkan bantuan.</p>
</div>

<!-- CART PAGE -->
<div id="cart" class="page hidden">
  <button class="back" onclick="showPage('home')">← Kembali</button>
  <h2>Keranjang</h2>
  <div id="cartItems"></div>
  <button onclick="checkout()">Checkout ke WhatsApp</button>
</div>

<script>
let cart = [];

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function showCart(){ showPage('cart'); renderCart(); }

function renderCart(){
  let box = document.getElementById('cartItems');
  if(cart.length===0){ box.innerHTML = '<p>Keranjang kosong.</p>'; return; }
  box.innerHTML = cart.map(i=>`<div>- ${i.name} ${i.size? '('+i.size+')':''} ${i.price? 'Rp '+i.price:''}</div>`).join('');
}

function addFish(name, priceRemaja, priceDewasa){
  let size = prompt("Pilih ukuran: Remaja / Dewasa");
  if(!size) return;
  size = size.toLowerCase();
  let price = size === 'remaja' ? priceRemaja : priceDewasa;
  cart.push({name, size, price});
  alert("Ditambahkan ke keranjang");
}
function addItem(name, price){
  cart.push({name, price});
  alert("Ditambahkan ke keranjang");
}
function addSticker(name){
  cart.push({name});
  alert("Ditambahkan ke keranjang");
}

function checkout(){
  if(cart.length===0) return alert("Keranjang kosong");
  let text = "Halo, saya ingin membeli:%0A" + cart.map(i=>`- ${i.name} ${i.size? '('+i.size+')':''} ${i.price? 'Rp '+i.price:''}`).join('%0A');
  location.href = "https://wa.me/6285646746618?text=" + text;
}
</script>

</body>
</html>
